name: Azure

# Deploys and operates the two-node setup on Azure. See docs/AZURE_RUNBOOK.md.
#
# It runs only when one of these tags is pushed. A branch push, a pull
# request, a schedule or a manual run never starts it:
#
#   ha-infra-*    create or update the network and the two VMs
#   ha-deploy-*   build the node for both architectures, install it and the
#                 drill tools, check it
#   ha-drill-*    the live drill: ha-drill-rehearsal* runs 4 faults, any
#                 other ha-drill-* tag 20 (docs/HA_DRILL.md)
#   ha-start-*    start both VMs
#   ha-stop-*     deallocate both VMs
#   ha-destroy-*  delete the resource group and everything in it
#
# There is no stored cloud secret. Every job that touches Azure runs in the
# GitHub environment `azure` and signs in with GitHub's OIDC token, which
# Azure accepts only for that environment of this repository. The ids it
# needs are environment variables, not secrets.
#
# Until the owner has created that environment and limited it to ha-* tags,
# the workflow does nothing: the `gate` job, which has no environment and
# no Azure access, reads the environment and its deployment rules, and
# every other job is skipped unless each rule is an ha-* tag. A skipped job
# does not create the environment.
#
# The repository is public, so are these logs. No step prints venue data,
# and the SSH source range and key and the subscription, tenant and client
# ids are masked. Every action is pinned to a commit, since these jobs can
# sign in to Azure and build the binary the VMs run.

on:
  push:
    tags:
      - "ha-infra-*"
      - "ha-deploy-*"
      - "ha-drill-*"
      - "ha-start-*"
      - "ha-stop-*"
      - "ha-destroy-*"

permissions:
  contents: read

concurrency:
  group: azure
  cancel-in-progress: false

env:
  RG: poly-ha

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      action: ${{ steps.check.outputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Is the azure environment there, and limited to chosen tags?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          action=${GITHUB_REF_NAME#ha-}
          action=${action%%-*}
          ops/azure/gate.sh azure | tee "$RUNNER_TEMP/gate"
          cat "$RUNNER_TEMP/gate" >>"$GITHUB_OUTPUT"
          echo "action=$action" >>"$GITHUB_OUTPUT"
          case "$(grep '^reason=' "$RUNNER_TEMP/gate")" in
            reason=ok) ;;
            reason=missing) echo "::notice::There is no GitHub environment named azure. Nothing was done. See docs/AZURE_RUNBOOK.md." ;;
            reason=open) echo "::notice::The azure environment lets any branch or tag deploy. Limit it to the ha-* tags first. Nothing was done." ;;
            reason=policy) echo "::notice::The azure environment must allow ha-* tags and nothing else. Its list of rules is empty or names another branch or tag. Nothing was done." ;;
            *) echo "::notice::The azure environment could not be read. Nothing was done." ;;
          esac

  infra:
    needs: gate
    if: needs.gate.outputs.ready == 'true' && needs.gate.outputs.action == 'infra'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: azure
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Keep the account ids out of the public log
        env:
          IDS: ${{ vars.AZURE_SUBSCRIPTION_ID }} ${{ vars.AZURE_TENANT_ID }} ${{ vars.AZURE_CLIENT_ID }}
        run: |
          for id in $IDS; do
            echo "::add-mask::$id"
          done
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The same check ops/azure/deploy.sh makes, before Azure is asked
      # anything: one IPv4 range, /24 or narrower. The template takes any
      # string, so without this 0.0.0.0/0 would deploy.
      - name: The SSH source range is /24 or narrower
        env:
          SSH_SOURCE_CIDR: ${{ vars.SSH_SOURCE_CIDR }}
          SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
        run: |
          test -n "$SSH_SOURCE_CIDR" && test -n "$SSH_PUBLIC_KEY"
          echo "::add-mask::$SSH_SOURCE_CIDR"
          echo "::add-mask::${SSH_SOURCE_CIDR%/*}"
          echo "::add-mask::$SSH_PUBLIC_KEY"
          ops/azure/check_cidr.sh "$SSH_SOURCE_CIDR"
      - name: What would change
        env:
          SSH_SOURCE_CIDR: ${{ vars.SSH_SOURCE_CIDR }}
          SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
        run: |
          echo "::add-mask::$SSH_SOURCE_CIDR"
          echo "::add-mask::${SSH_SOURCE_CIDR%/*}"
          echo "::add-mask::$SSH_PUBLIC_KEY"
          az deployment group what-if --name poly-ha-nodes --resource-group "$RG" \
            --template-file deploy/azure/nodes.bicep \
            --parameters "sshSourceCidr=$SSH_SOURCE_CIDR" "sshPublicKey=$SSH_PUBLIC_KEY" \
            --result-format ResourceIdOnly
      - name: Create or update the network and the two VMs
        env:
          SSH_SOURCE_CIDR: ${{ vars.SSH_SOURCE_CIDR }}
          SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
        run: |
          echo "::add-mask::$SSH_SOURCE_CIDR"
          echo "::add-mask::${SSH_SOURCE_CIDR%/*}"
          echo "::add-mask::$SSH_PUBLIC_KEY"
          ops/azure/check_cidr.sh "$SSH_SOURCE_CIDR"
          az deployment group create --name poly-ha-nodes --resource-group "$RG" \
            --template-file deploy/azure/nodes.bicep \
            --parameters "sshSourceCidr=$SSH_SOURCE_CIDR" "sshPublicKey=$SSH_PUBLIC_KEY" \
            --output none
          az vm list -g "$RG" -d \
            --query "[].{name:name, power:powerState, size:hardwareProfile.vmSize, zone:zones[0]}" -o table

  # The node as it runs on the VMs: no seeded faults compiled in, built on
  # the same Ubuntu release as the VMs so it links the same system TLS.
  build:
    needs: gate
    if: needs.gate.outputs.ready == 'true' && needs.gate.outputs.action == 'deploy'
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --locked --release -p app --bin node
      - name: Name the build and record its digest
        run: |
          mkdir out
          cp target/release/node "out/node-${{ matrix.arch }}"
          (cd out && sha256sum "node-${{ matrix.arch }}" | cut -d' ' -f1 >"node-${{ matrix.arch }}.sha256")
          cat "out/node-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-${{ matrix.arch }}
          path: out/
          retention-days: 3

  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.ready == 'true' && needs.gate.outputs.action == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: azure
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - name: Keep the account ids out of the public log
        env:
          IDS: ${{ vars.AZURE_SUBSCRIPTION_ID }} ${{ vars.AZURE_TENANT_ID }} ${{ vars.AZURE_CLIENT_ID }}
        run: |
          for id in $IDS; do
            echo "::add-mask::$id"
          done
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # One sign-in is enough here: the only storage call is the next step,
      # and the management token from the sign-in outlives this job's 45
      # minutes. The drill job, which runs longer, signs in again.
      - name: Upload both builds to releases/<sha>/
        run: |
          account=$(az storage account list -g "$RG" --query "[0].name" -o tsv)
          test -n "$account"
          for arch in x64 arm64; do
            az storage blob upload --auth-mode login --account-name "$account" \
              --container-name archive --name "releases/$GITHUB_SHA/node-$arch" \
              --file "out/node-$arch" --overwrite true --output none
          done
      - name: Start the VMs if they are deallocated
        run: |
          for n in node-a node-b; do
            az vm start -g "$RG" -n "$n" --output none
          done
      - name: Install on node-a, wait for its feeds, then node-b
        run: |
          # x64 on node-a, Arm64 on node-b. Each install returns only once
          # /readyz is 200, that is with all three venue feeds connected,
          # so node-b is not touched until node-a is serving again.
          ops/azure/vm_run.sh node-a install "$GITHUB_SHA" "$(cat out/node-x64.sha256)"
          ops/azure/vm_run.sh node-b install "$GITHUB_SHA" "$(cat out/node-arm64.sha256)"
      - name: Install this commit's drill tools on both nodes
        run: |
          # The scripts the drill job runs on the VMs (deploy/azure/drill).
          # Not in cloud-init, which Azure will not let change on a
          # running VM. The drill job checks this digest before it opens.
          ops/azure/vm_tools.sh install node-a
          ops/azure/vm_tools.sh install node-b
      - name: Store contract suite against the real account, from each VM
        run: |
          ops/azure/vm_run.sh node-a selftest "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-a"
          ops/azure/vm_run.sh node-b selftest "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-b"
      - name: One leader, and slots being committed
        run: |
          # A takeover needs up to 41 s and the first slot closes when it
          # is two minutes old, so give it eight minutes.
          for i in $(seq 1 16); do
            a=$(ops/azure/vm_run.sh node-a status || true)
            b=$(ops/azure/vm_run.sh node-b status || true)
            leaders=$(printf '%s\n%s\n' "$a" "$b" | grep -c '^poly_lease_leader 1$' || true)
            commits=$(printf '%s\n%s\n' "$a" "$b" | awk '/^poly_archive_commits_total /{s+=$2} END{print s+0}')
            echo "check $i: leaders=$leaders commits=$commits"
            if [ "$leaders" = 1 ] && [ "$commits" -gt 0 ]; then
              printf '%s\n\n%s\n' "$a" "$b" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          printf '%s\n\n%s\n' "$a" "$b"
          echo "::error::expected exactly one leader and at least one committed slot"
          exit 1

  # The live drill (spec 4.7, docs/HA_DRILL.md). A per-run key for the
  # restricted drill user, a security group rule for this runner's address
  # only, SSH forwards to both nodes, a client on both and a control client
  # on node-a, kills and leader freezes through the agent on each VM, then
  # both nodes' recordings and lease logs collected under drill/<run>/ in
  # the archive and judged with their union as truth. The cleanup step runs
  # whatever happened before it, also on a cancel, and fails the job unless
  # the rule and the key are gone and both nodes run with one leader. Then
  # a VM the drill found deallocated is deallocated again. Only
  # report.json (counts and timings) leaves the runner.
  #
  # The sign-in is repeated before collect and before close. GitHub's token
  # behind it lasts minutes, and az asks Azure for a token per scope when it
  # first needs one, so a storage token first wanted an hour in would fail.
  # The run and collect steps have their own time limits, so the cleanup
  # starts as an ordinary step with time left in the job.
  drill:
    needs: gate
    if: needs.gate.outputs.ready == 'true' && needs.gate.outputs.action == 'drill'
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    environment: azure
    permissions:
      id-token: write
      contents: read
    env:
      DRILL_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
      CHAOS: target/release/chaos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build chaos, without the seeded faults
        run: cargo build --locked --release -p app --bin chaos
      - name: The size of this drill
        run: |
          # The plan is seeded with the run id. A rehearsal is three kills
          # and one leader freeze; a full drill fourteen and six.
          case "$GITHUB_REF_NAME" in
            ha-drill-rehearsal*) faults=4 freezes=1 ;;
            *) faults=20 freezes=6 ;;
          esac
          {
            echo "DRILL_FAULTS=$faults"
            echo "DRILL_LEADER_FREEZES=$freezes"
            echo "DRILL_SEED=$GITHUB_RUN_ID"
          } >>"$GITHUB_ENV"
          echo "$faults faults, $freezes of them leader freezes, seed $GITHUB_RUN_ID"
      - name: Keep the account ids out of the public log
        env:
          IDS: ${{ vars.AZURE_SUBSCRIPTION_ID }} ${{ vars.AZURE_TENANT_ID }} ${{ vars.AZURE_CLIENT_ID }}
        run: |
          for id in $IDS; do
            echo "::add-mask::$id"
          done
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Record how the VMs are, start them, and wait for one leader
        timeout-minutes: 20
        run: |
          ops/azure/drill.sh start
          ops/azure/drill.sh ready
      - name: Open, a key for this run and an SSH rule for this runner only
        timeout-minutes: 15
        run: ops/azure/drill.sh open
      - name: Drive the faults
        # 4 faults 90 s apart take about 8 minutes, 20 about 35.
        timeout-minutes: ${{ startsWith(github.ref_name, 'ha-drill-rehearsal') && 15 || 45 }}
        run: ops/azure/drill.sh run
      - name: Sign in again for collect
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Collect both nodes' recordings and judge
        timeout-minutes: 20
        run: ops/azure/drill.sh collect
      - name: Sign in again for close
        if: always()
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Close, rule and key removed, both nodes healthy
        if: always()
        timeout-minutes: 35
        run: ops/azure/drill.sh close
      - name: Put the VMs back as the drill found them
        if: always()
        timeout-minutes: 20
        run: ops/azure/drill.sh restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: drill-report
          path: ${{ runner.temp }}/drill-report/report.json
          if-no-files-found: ignore
          retention-days: 30

  start:
    needs: gate
    if: needs.gate.outputs.ready == 'true' && needs.gate.outputs.action == 'start'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: azure
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Keep the account ids out of the public log
        env:
          IDS: ${{ vars.AZURE_SUBSCRIPTION_ID }} ${{ vars.AZURE_TENANT_ID }} ${{ vars.AZURE_CLIENT_ID }}
        run: |
          for id in $IDS; do
            echo "::add-mask::$id"
          done
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          for n in node-a node-b; do
            az vm start -g "$RG" -n "$n" --output none
          done
          az vm list -g "$RG" -d --query "[].{name:name, power:powerState}" -o table

  stop:
    needs: gate
    if: needs.gate.outputs.ready == 'true' && needs.gate.outputs.action == 'stop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: azure
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Keep the account ids out of the public log
        env:
          IDS: ${{ vars.AZURE_SUBSCRIPTION_ID }} ${{ vars.AZURE_TENANT_ID }} ${{ vars.AZURE_CLIENT_ID }}
        run: |
          for id in $IDS; do
            echo "::add-mask::$id"
          done
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          for n in node-a node-b; do
            az vm deallocate -g "$RG" -n "$n" --output none
          done
          az vm list -g "$RG" -d --query "[].{name:name, power:powerState}" -o table

  destroy:
    needs: gate
    if: needs.gate.outputs.ready == 'true' && needs.gate.outputs.action == 'destroy'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: azure
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Keep the account ids out of the public log
        env:
          IDS: ${{ vars.AZURE_SUBSCRIPTION_ID }} ${{ vars.AZURE_TENANT_ID }} ${{ vars.AZURE_CLIENT_ID }}
        run: |
          for id in $IDS; do
            echo "::add-mask::$id"
          done
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The identity this job signed in as lives in the group, so the
      # delete is handed to Azure and not waited for. Check afterwards
      # with ops/azure/status.sh.
      - run: az group delete -n "$RG" --yes --no-wait
