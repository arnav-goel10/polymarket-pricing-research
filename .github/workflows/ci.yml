name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo run -p app --bin replay -- fixtures/replay-sample.json --json
      - name: Replay the committed live recording
        run: cargo run --release -p app --bin latency_report -- --recording fixtures/live-sample.prec

  benches:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile benchmarks (not run; CI machines are too noisy to gate on)
        run: cargo bench --workspace --no-run

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --summary-only
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  fuzz-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets and run each for 60 s
        run: |
          for t in rtds_frame binance_message clob_book_stream recording_reader; do
            cargo fuzz run "$t" fuzz/corpus/"$t" -- -max_total_time=60
          done

  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/analyze_shadow_strategy.py
      - run: python -m py_compile scripts/check_paper_only.py
      - run: python -m unittest tests/test_check_paper_only.py -v
      - run: python scripts/check_paper_only.py
      - run: python scripts/analyze_shadow_strategy.py --check --data fixtures/shadow-ledger-v1
      - run: python scripts/analyze_shadow_strategy.py --data fixtures/shadow-ledger-v1 --json demo/summary.json
      - run: git diff --exit-code -- demo/summary.json

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: poly:ci
      - name: Smoke-test the image (liveness endpoint)
        run: |
          docker run -d --name poly -p 8080:8080 poly:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          docker stop --time 10 poly
          test "$(docker inspect -f '{{.State.ExitCode}}' poly)" = "0"
