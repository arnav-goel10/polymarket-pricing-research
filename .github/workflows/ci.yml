name: CI

on:
  push:
    branches: [main, master, ha-failover]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Seeded node faults must each be caught
        run: |
          cargo clippy --locked -p app --all-targets --features mutants -- -D warnings
          cargo test --locked -p app --features mutants --test stream_roundtrip -- --nocapture
      - run: cargo run --locked -p app --bin replay -- fixtures/replay-sample.json --json
      - name: Replay the committed live recording
        run: cargo run --locked --release -p app --bin latency_report -- --recording fixtures/live-sample.prec
      - name: Check event keys on the committed live recording
        run: cargo run --locked --release -p ha --bin keycheck -- fixtures/live-sample.prec --fail-on-collision

  # Milestone B gate: two nodes under kills and freezes behind the hedged
  # client, checked against the simulator's total truth. The baselines must
  # pass with 0 missing and 0 duplicates; each seeded fault must fail with
  # exactly its reason. One build carries the faults; a run without
  # --mutant uses none of them.
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHAOS_BIN: target/release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build node, venue_sim and chaos with the seeded faults compiled in
        run: cargo build --locked --release -p app --features mutants --bin node --bin venue_sim --bin chaos
      - name: Baseline, synthetic, seed 1 at 200 frames/s, 12 faults, one node 20 ms behind
        run: scripts/chaos_case.sh seed1 pass --seed 1 --rate 200 --faults 12 --lag-ms 20
      - name: Baseline, synthetic, seed 2 at 2,000 frames/s, 12 faults
        run: scripts/chaos_case.sh seed2 pass --seed 2 --rate 2000 --faults 12
      - name: Baseline, fixture playback at 300 frames/s, 3 faults
        run: scripts/chaos_case.sh fixture pass --recording fixtures/live-sample.prec --rate 300 --faults 3
      - name: Seeded faults, each caught by name
        run: |
          fail=0
          # Kill a, freeze b, cut a: one fault of each kind.
          m() {
            scripts/chaos_case.sh "$1" "$2" --seed 3 --rate 200 --faults "${3:-3}" --gap-ms 3000 --mutant "$1" || fail=1
          }
          m no-dedup duplicate
          m single-node missing
          m no-reconnect missing
          m seq-skip seq_gap
          # A resume only shows a stale answer when the node is ahead of the
          # client, which the cut gives: the node keeps ingesting.
          m stale-resume resume
          m overlap-kill missing 2
          # Control: a node that resends frames under fresh seqs must pass,
          # with the repeats dropped by key.
          m dup-frame pass+self_repeats
          exit "$fail"

  benches:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile benchmarks (not run; CI machines are too noisy to gate on)
        run: cargo bench --locked --workspace --no-run

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --locked --workspace --summary-only
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  fuzz-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets and run each for 60 s
        run: |
          for t in rtds_frame binance_message clob_book_stream recording_reader; do
            cargo fuzz run "$t" fuzz/corpus/"$t" -- -max_total_time=60
          done

  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/analyze_shadow_strategy.py
      - run: python -m py_compile scripts/check_paper_only.py
      - run: python -m unittest tests/test_check_paper_only.py -v
      - run: python scripts/check_paper_only.py
      - run: python scripts/analyze_shadow_strategy.py --check --data fixtures/shadow-ledger-v1
      - run: python scripts/analyze_shadow_strategy.py --data fixtures/shadow-ledger-v1 --json demo/summary.json
      - run: git diff --exit-code -- demo/summary.json

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: poly:ci
      - name: Smoke-test the image (liveness endpoint)
        run: |
          docker run -d --name poly -p 8080:8080 poly:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          docker stop --time 10 poly
          test "$(docker inspect -f '{{.State.ExitCode}}' poly)" = "0"
