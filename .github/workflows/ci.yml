name: CI

on:
  push:
    branches: [main, master, ha-failover]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Lease schedule property, and each seeded lease fault caught
        run: cargo test --locked -p ha caslease -- --nocapture
      - name: Seeded node faults must each be caught
        run: |
          cargo clippy --locked -p app --all-targets --features mutants -- -D warnings
          cargo test --locked -p app --features mutants --test stream_roundtrip -- --nocapture
      - run: cargo run --locked -p app --bin replay -- fixtures/replay-sample.json --json
      - name: Replay the committed live recording
        run: cargo run --locked --release -p app --bin latency_report -- --recording fixtures/live-sample.prec
      - name: Check event keys on the committed live recording
        run: cargo run --locked --release -p ha --bin keycheck -- fixtures/live-sample.prec --fail-on-collision
      - name: Snapshot size on the committed live recording
        run: cargo test --locked -p ha --test fixture_snapshot -- --nocapture

  # Milestone B gate: two nodes under kills and freezes behind the hedged
  # client, checked against the simulator's total truth. The baselines must
  # pass with 0 missing and 0 duplicates; each seeded fault must fail with
  # exactly its reason. One build carries the faults; a run without
  # --mutant uses none of them. The archive cases add the lease and the
  # archive on a shared directory store, judged from its journal.
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHAOS_BIN: target/release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: chaos
      - name: Build node, venue_sim and chaos with the seeded faults compiled in
        run: cargo build --locked --release -p app --features mutants --bin node --bin venue_sim --bin chaos
      # The two venue cuts at the end replay each venue's greeting to a node
      # the client is live on, so late copies must show and none be lost.
      - name: Baseline, synthetic, seed 1 at 200 frames/s, 12 faults and 2 venue cuts, one node 20 ms behind
        run: scripts/chaos_case.sh seed1 pass+late --seed 1 --rate 200 --faults 12 --venue-cuts 2 --lag-ms 20
      - name: Baseline, synthetic, seed 2 at 2,000 frames/s, 12 faults and 2 venue cuts
        run: scripts/chaos_case.sh seed2 pass+late --seed 2 --rate 2000 --faults 12 --venue-cuts 2
      - name: Baseline, fixture playback at 300 frames/s, 3 faults
        run: scripts/chaos_case.sh fixture pass --recording fixtures/live-sample.prec --rate 300 --faults 3
      - name: Seeded faults, each caught by name
        run: |
          fail=0
          # Kill a, freeze b, cut a: one fault of each kind.
          m() {
            scripts/chaos_case.sh "$1" "$2" --seed 3 --rate 200 --faults "${3:-3}" --gap-ms 3000 --mutant "$1" || fail=1
          }
          m no-dedup duplicate
          m single-node missing
          m no-reconnect missing
          m seq-skip seq_gap
          # A resume only shows a stale answer when the node is ahead of the
          # client, which the cut gives: the node keeps ingesting.
          m stale-resume resume
          m overlap-kill missing 2
          # A client that delivers late copies is caught once a venue cut
          # replays history to it.
          scripts/chaos_case.sh late-deliver duplicate --seed 3 --rate 200 --faults 3 --gap-ms 3000 --venue-cuts 1 --mutant late-deliver || fail=1
          # Control: a node that resends frames under fresh seqs must pass,
          # with the repeats dropped by key.
          m dup-frame pass+self_repeats
          exit "$fail"
      - name: Archive, both nodes on one directory store, a kill, a freeze and two leader freezes
        run: scripts/chaos_case.sh archive pass --seed 4 --rate 200 --faults 4 --gap-ms 4000 --archive 1 --leader-freezes 2
      - name: Seeded archive faults, each caught by name
        run: |
          fail=0
          # One leader freeze: the peer takes over and the frozen leader
          # wakes as a zombie.
          a() {
            scripts/chaos_case.sh "$1" "$2" --seed 5 --rate 200 --faults 1 --gap-ms 3000 --archive 1 --leader-freezes 1 --mutant "$1" || fail=1
          }
          a no-fence stale_epoch_commit
          a epoch-reuse epoch_two_holders
          exit "$fail"

  # The archive case again on 30 other seeds, five to a runner. One green
  # run of a case with timed faults says little; this is the repeat that
  # shows a failure is not waiting on timing. Every run must pass.
  chaos-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      CHAOS_BIN: target/release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: chaos
          save-if: false
      - name: Build node, venue_sim and chaos
        run: cargo build --locked --release -p app --features mutants --bin node --bin venue_sim --bin chaos
      - name: Archive case, five seeds, a kill, a freeze and two leader freezes each
        run: |
          fail=0
          for i in 1 2 3 4 5; do
            seed=$((100 + ${{ matrix.shard }} * 5 + i))
            scripts/chaos_case.sh "archive-$seed" pass --seed "$seed" --rate 200 --faults 4 --gap-ms 4000 --archive 1 --leader-freezes 2 || fail=1
          done
          exit "$fail"

  # The Blob store against the Azurite emulator: the same contract suite the
  # directory store passes, racing writers, a zombie leader fenced by the
  # conditional write, and writes whose reply or request is lost on the
  # way. Nothing here touches Azure. The account key below is made up for
  # this job's emulator and opens nothing else.
  azurite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.34.0
        ports:
          - 10000:10000
        env:
          AZURITE_ACCOUNTS: "polyci:cG9seS1jaS1lbXVsYXRvci1vbmx5LW5vdC1hLXNlY3JldA=="
    env:
      POLY_AZURITE_URL: http://127.0.0.1:10000/polyci
      POLY_AZURITE_ACCOUNT: polyci
      POLY_AZURITE_KEY: "cG9seS1jaS1lbXVsYXRvci1vbmx5LW5vdC1hLXNlY3JldA=="
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Blob store tests against Azurite, all ten must run
        run: |
          set -o pipefail
          cargo test --locked -p ha --lib azure::tests::emulator -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/azurite.out"
          grep -q "test result: ok. 10 passed; 0 failed; 0 ignored" "$RUNNER_TEMP/azurite.out"

  # The Azure deploy code, checked without an Azure account: both templates
  # compile, the scripts lint, and a fake `az` shows that no script changes
  # anything without --yes or on another subscription. Nothing is deployed
  # from this workflow; .github/workflows/azure.yml does that, on ha-* tags.
  azure-deploy-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Both Bicep templates compile, with no warning
        run: |
          for t in bootstrap nodes; do
            az bicep build --file "deploy/azure/$t.bicep" --outdir "$RUNNER_TEMP" 2>"$RUNNER_TEMP/$t.log" || {
              cat "$RUNNER_TEMP/$t.log"
              exit 1
            }
            cat "$RUNNER_TEMP/$t.log"
            ! grep -E "Warning|Error" "$RUNNER_TEMP/$t.log"
            test -s "$RUNNER_TEMP/$t.json"
          done
      - name: The compiled templates hold what the runbook lists
        run: python3 deploy/azure/check_templates.py "$RUNNER_TEMP/bootstrap.json" "$RUNNER_TEMP/nodes.json"
      - name: Shell scripts lint
        run: shellcheck --severity=warning -x ops/azure/*.sh deploy/azure/vm/*.sh
      - name: No script changes anything without --yes
        run: ops/azure/test_dry_run.sh
      - name: The Azure workflow lints
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 \
            -color .github/workflows/azure.yml

  benches:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile benchmarks (not run; CI machines are too noisy to gate on)
        run: cargo bench --locked --workspace --no-run

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --locked --workspace --summary-only
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  fuzz-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets and run each for 60 s
        run: |
          for t in rtds_frame binance_message clob_book_stream recording_reader; do
            cargo fuzz run "$t" fuzz/corpus/"$t" -- -max_total_time=60
          done

  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/analyze_shadow_strategy.py
      - run: python -m py_compile scripts/check_paper_only.py
      - run: python -m unittest tests/test_check_paper_only.py -v
      - run: python scripts/check_paper_only.py
      - run: python scripts/analyze_shadow_strategy.py --check --data fixtures/shadow-ledger-v1
      - run: python scripts/analyze_shadow_strategy.py --data fixtures/shadow-ledger-v1 --json demo/summary.json
      - run: git diff --exit-code -- demo/summary.json

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: poly:ci
      - name: Smoke-test the image (liveness endpoint)
        run: |
          docker run -d --name poly -p 8080:8080 poly:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          docker stop --time 10 poly
          test "$(docker inspect -f '{{.State.ExitCode}}' poly)" = "0"
