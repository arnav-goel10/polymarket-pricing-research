[workspace]
members = ["crates/poly_core", "crates/pricing", "crates/stats", "crates/feeds", "crates/market", "crates/execution", "crates/app"]
resolver = "2"

[workspace.dependencies]
statrs = "0.19"
serde = { version = "1", features = ["derive"] }
approx = "0.5"
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "charset", "http2", "system-proxy"] }
alloy-primitives = "1.6"
alloy-sol-types = "1.6"
hmac = "0.13"
sha2 = "0.10"
hex = "0.4"
crc32fast = "1"
serde_json = "1"
thiserror = "2"
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
