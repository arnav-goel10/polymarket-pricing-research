# cargo-deny: security advisories, licences, duplicate crates, sources.
# Run locally with `cargo deny check`.

[graph]
all-features = false

[advisories]
# RustSec advisory database. Unmaintained crates are reported for workspace
# dependencies; vulnerabilities always fail.
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licences only. Anything else fails the check.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
