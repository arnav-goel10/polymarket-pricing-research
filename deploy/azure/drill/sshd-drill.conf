# What the drill user may do over SSH, whatever its key's options say.
# drill-open.sh installs this as /etc/ssh/sshd_config.d/20-poly-drill.conf,
# checks it with `sshd -t` before any reload and stops the drill if the
# check fails, so a bad file never reaches the running sshd.
#
# Local TCP forwards to the node's stream, health and drill agent ports on
# loopback, and nothing else: no Unix socket forward, no remote forward or
# listener, no agent or X11 forward, no terminal. A Match block in an
# included file ends with that file.
Match User drill
	AllowTcpForwarding local
	PermitOpen 127.0.0.1:9100 127.0.0.1:9101 127.0.0.1:9102
	PermitListen none
	AllowStreamLocalForwarding no
	AllowAgentForwarding no
	X11Forwarding no
	PermitTTY no
	PermitTunnel no
	GatewayPorts no
	ForceCommand /usr/sbin/nologin
