[package]
name = "app"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
poly_core = { path = "../poly_core" }
pricing = { path = "../pricing" }
stats = { path = "../stats" }
feeds = { path = "../feeds" }
market = { path = "../market" }
execution = { path = "../execution" }
ha = { path = "../ha" }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }

[features]
# Seeded faults for the HA harness, chosen at run time with POLY_MUTANT.
# Never enabled in a deploy build; the node refuses POLY_MUTANT without it.
mutants = []

[dev-dependencies]
criterion = { workspace = true }
approx = { workspace = true }
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "replay"
harness = false
