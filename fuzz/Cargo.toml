[package]
name = "poly-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
feeds = { path = "../crates/feeds" }
market = { path = "../crates/market" }

# Kept out of the main workspace: it needs nightly and libFuzzer.
[workspace]
members = ["."]

[[bin]]
name = "rtds_frame"
path = "fuzz_targets/rtds_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "binance_message"
path = "fuzz_targets/binance_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clob_book_stream"
path = "fuzz_targets/clob_book_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recording_reader"
path = "fuzz_targets/recording_reader.rs"
test = false
doc = false
bench = false
